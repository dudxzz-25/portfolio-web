name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Check required site files
        run: test -f index.html && test -f assets/style.css && test -f README.md
